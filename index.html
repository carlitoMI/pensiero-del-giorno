<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101d25">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<title>Un momento</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  min-height: 100svh;
  background:
    radial-gradient(ellipse at top, #284b50, transparent 65%),
    #101d25;
  color: #f4eee3;
  font-family: Georgia, serif;
}
main {
  min-height: 100vh;
  min-height: 100svh;
  max-width: 680px;
  margin: auto;
  padding: 38px 28px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  text-align: center;
}
header, footer, .source {
  font-family: system-ui, sans-serif;
}
.brand {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 5px;
  color: #d6bd90;
}
#date {
  margin-top: 12px;
  font-size: 13px;
  color: #acbdbb;
}
.orb {
  width: 78px;
  height: 78px;
  margin: 30px auto 44px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #eddfbc, #94bab2);
  box-shadow: 0 0 70px #acc8bd33;
  animation: breathe 8s ease-in-out infinite;
}
@keyframes breathe {
  0%, 100% { transform: scale(.88); }
  50% { transform: scale(1.1); }
}
blockquote {
  margin: 0;
  font-size: clamp(25px, 6.5vw, 36px);
  line-height: 1.5;
}
.source {
  margin-top: 26px;
  color: #a7bbb6;
  font-size: 12px;
  letter-spacing: 1px;
}
footer {
  padding-top: 40px;
  color: #a7bbb6;
  font-size: 13px;
  line-height: 1.7;
}
@media (prefers-reduced-motion: reduce) {
  .orb { animation: none; }
}
</style>
</head>
<body>
<main>
  <header>
    <div class="brand">Un momento</div>
    <div id="date"></div>
  </header>

  <section aria-label="Pensiero del giorno">
    <div class="orb" aria-hidden="true"></div>
    <blockquote id="thought"></blockquote>
    <div class="source">Riflessione originale · Un momento</div>
  </section>

  <footer>
    Per oggi, basta questo.<br>
    Il prossimo pensiero ti aspetta domani.
  </footer>
</main>

<script>
const thoughts = [
  "Non devi seguire ogni pensiero. Puoi accorgerti che è arrivato e lasciargli continuare il viaggio.",
  "Appoggia per un momento ciò che non puoi risolvere. Anche le mani della mente hanno bisogno di riposo.",
  "Mentre fai una cosa, prova a esserci. Non per farla meglio, ma per non perderti mentre la fai.",
  "Una giornata difficile non deve diventare un giudizio su tutta la tua vita.",
  "Puoi riconoscere ciò che senti senza doverlo spiegare subito.",
  "Non serve trasformare questa pausa in un altro obiettivo. Può essere soltanto una pausa.",
  "Ascolta un suono vicino. Per un momento, lascia che il mondo arrivi a te senza doverlo cercare.",
  "Quando ti accorgi di esserti distratto, sei già tornato. Non aggiungere un rimprovero al ritorno.",
  "C'è differenza tra avere un pensiero e dovergli credere. Oggi puoi lasciare un po' di spazio tra le due cose.",
  "Anche se la giornata corre, puoi sentire il contatto dei piedi con il pavimento.",
  "Non devi essere sereno per concederti gentilezza.",
  "Lascia che almeno un gesto di oggi non serva ad arrivare altrove: bere, camminare, guardare il cielo.",
  "Puoi ascoltare un'emozione senza lasciarle decidere ogni tua azione.",
  "Prima di rispondere, concediti un istante. Non per trovare la risposta perfetta, ma per scegliere la tua.",
  "Il riposo non deve essere una ricompensa per esserti consumato abbastanza.",
  "Quando tutto sembra chiedere attenzione, scegli una sola cosa vicina e reale.",
  "Puoi prenderti cura di qualcosa senza riuscire a controllarne il risultato.",
  "Oggi prova a notare anche ciò che non manca.",
  "Non occorre chiamare bella questa giornata per trovare qualcosa da abitare al suo interno.",
  "Lascia che un pensiero resti una frase nella mente, senza trasformarlo subito in una previsione.",
  "Se ti senti stanco, prova ad ascoltare la stanchezza prima di giudicarla.",
  "Per qualche istante non migliorare nulla. Nota soltanto quello che c'è.",
  "Non tutto ciò che resta incompiuto deve seguirti dentro ogni pausa.",
  "Essere presente non significa non distrarsi mai. Significa poter tornare."
];

function render() {
  const now = new Date();
  const day = Math.floor(
    Date.UTC(now.getFullYear(), now.getMonth(), now.getDate())
    / 86400000
  );
  const index = ((day % thoughts.length) + thoughts.length)
    % thoughts.length;

  document.getElementById("thought").textContent =
    thoughts[index];

  document.getElementById("date").textContent =
    now.toLocaleDateString("it-IT", {
      weekday: "long",
      day: "numeric",
      month: "long"
    });
}

render();
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) render();
});
setInterval(render, 60000);

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js")
      .catch(error => console.warn("Service worker:", error));
  });
}
</script>
</body>
</html>
